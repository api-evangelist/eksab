aid: eksab
name: Eksab
description: >-
  Eksab is a Cairo-based daily fantasy sports and football-prediction platform
  for the MENA region. Founded in 2017 by Aly Mahmoud, it lets fans predict the
  scores and outcomes of live football matches, earn points based on the
  accuracy of their picks, and win prizes through free and paid competitions.
  The platform has grown to over 700,000 registered users making more than a
  million picks each month, and in 2022 became the exclusive fantasy sports
  partner of the Egyptian Premier League. Eksab is backed by 500 Global (500
  Startups), 4DX Ventures, and others across roughly $3.7M in seed funding.
  This profile is maintained in the API Evangelist network; Eksab is a consumer
  mobile/web product and does not currently publish a public developer API
  surface.
